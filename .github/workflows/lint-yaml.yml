# workflows/lint-yaml.yml
#
# Lint YAML
# Lint YAML files using Prettier.

name: Lint YAML

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: lint-yaml-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ github.event_name != 'pull_request' || steps.filter.outputs.relevant == 'true' }}
    steps:
      - uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            relevant:
              - "**/*.yml"
              - "**/*.yaml"
              - ".github/workflows/lint-yaml.yml"

  lint-yaml:
    name: Lint YAML Files
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.should_run == 'true'

    steps:
      - name: Checkout Git Repository
        uses: actions/checkout@v6

      - name: Set up NodeJS Environment
        uses: actions/setup-node@v6

      - name: Install Prettier
        run: npm install -g prettier

      - name: Check YAML Formatting
        run: prettier --check "**/*.{yml,yaml}" --ignore-path .prettierignore

  # Required for branch protection — GitHub lacks "required when present" for
  # status checks so this gate always runs and reports pass/fail. Standard pattern:
  # https://github.com/astral-sh/ruff/blob/main/.github/workflows/ci.yaml
  # https://github.com/orgs/community/discussions/26251
  result:
    name: Result
    if: always()
    needs: [changes, lint-yaml]
    runs-on: ubuntu-latest
    steps:
      - run: |
          if [[ "${{ contains(github.event.pull_request.labels.*.name, 'ignore-ci-checks') }}" == "true" ]]; then
            echo "ignore-ci-checks label present — skipping CI gate"
            exit 0
          fi
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]]; then
            echo "CI failed"
            exit 1
          fi
