# workflows/ci.yml
#
# CI Gate
# Single required check that waits for all other CI workflows to complete.
# Mark only "CI / CI" as a required status check in branch protection —
# it aggregates the results of every other workflow automatically.
#
# Supports the `ignore-ci-checks` label to bypass the gate.

name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
      - "0.*.x"
      - "moe/**"

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - name: Wait for all CI checks
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'ignore-ci-checks') }}
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const sha = context.payload.pull_request.head.sha;
            const self = 'CI';

            const TIMEOUT = 60 * 60 * 1000; // 60 minutes
            const POLL = 30 * 1000; // 30 seconds
            const start = Date.now();

            // Give other workflows time to register check runs
            core.info('Waiting 30s for workflows to start...');
            await new Promise(r => setTimeout(r, 30_000));

            let prevCount = 0;

            while (Date.now() - start < TIMEOUT) {
              const { data } = await github.rest.checks.listForRef({
                owner, repo, ref: sha, per_page: 100, filter: 'latest'
              });

              const checks = data.check_runs.filter(cr => cr.name !== self);

              // If no other checks appeared after 2 minutes, nothing to wait for
              if (checks.length === 0) {
                if (Date.now() - start > 120_000) {
                  core.info('No other CI checks found — passing');
                  return;
                }
                core.info('Waiting for checks to appear...');
                await new Promise(r => setTimeout(r, POLL));
                continue;
              }

              const active = checks.filter(cr => cr.status !== 'completed');
              const done = checks.filter(cr =>
                cr.status === 'completed' && cr.conclusion !== 'cancelled'
              );

              core.info(`${done.length} done, ${active.length} in progress (${checks.length} total)`);
              for (const cr of active) core.info(`  ⏳ ${cr.name}`);

              if (active.length === 0 && done.length > 0) {
                // Stability: if new checks appeared since last poll, re-check
                if (checks.length > prevCount) {
                  core.info('New checks appeared, re-polling...');
                  prevCount = checks.length;
                  await new Promise(r => setTimeout(r, POLL));
                  continue;
                }

                const failed = done.filter(cr =>
                  !['success', 'skipped', 'neutral'].includes(cr.conclusion)
                );
                if (failed.length > 0) {
                  for (const cr of failed) core.info(`  ❌ ${cr.name}: ${cr.conclusion}`);
                  core.setFailed(`${failed.length} CI check(s) failed`);
                  return;
                }

                core.info('✅ All CI checks passed!');
                return;
              }

              prevCount = checks.length;
              await new Promise(r => setTimeout(r, POLL));
            }

            core.setFailed('Timed out waiting for CI checks after 60 minutes');

      - name: Skip (ignore-ci-checks)
        if: ${{ contains(github.event.pull_request.labels.*.name, 'ignore-ci-checks') }}
        run: echo "ignore-ci-checks label present — CI gate passed"
