# workflows/lint-markdown.yml
#
# Lint Markdown
# Lint Markdown files using markdownlint and Prettier.

name: Lint Markdown

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: lint-markdown-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ github.event_name != 'pull_request' || steps.filter.outputs.relevant == 'true' }}
    steps:
      - uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            relevant:
              - "**/*.md"
              - "**/*.mdx"
              - ".github/workflows/lint-markdown.yml"

  lint-markdown:
    name: Lint Markdown Files
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.should_run == 'true'

    steps:
      - name: Checkout Git Repository
        uses: actions/checkout@v6

      - name: Set up NodeJS Environment
        uses: actions/setup-node@v6

      - name: Install Prettier and markdownlint
        run: npm install -g prettier markdownlint-cli

      - name: Run Markdown Lint
        run: markdownlint "**/*.md"

      - name: Run Prettier
        run: prettier --check "{**/*.md,**/*.mdx}" --ignore-path .prettierignore

  result:
    name: Result
    if: always()
    needs: [changes, lint-markdown]
    runs-on: ubuntu-latest
    steps:
      - run: |
          if [[ "${{ contains(github.event.pull_request.labels.*.name, 'ignore-ci-checks') }}" == "true" ]]; then
            echo "ignore-ci-checks label present — skipping CI gate"
            exit 0
          fi
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]]; then
            echo "CI failed"
            exit 1
          fi
